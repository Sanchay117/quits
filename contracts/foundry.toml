[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
# Arc targets Osaka; Prague bytecode (PUSH0, MCOPY, TSTORE/TLOAD) runs unchanged there.
evm_version = "prague"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = ["forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[lint]
# Every other lint is on. Warnings at a single site are resolved or annotated on that line with the reason (see
# "forge-lint:" in src/). Excluded project-wide after checking every site by hand:
#  require-revert-in-loop  settle() is all-or-nothing by design: one bad clear, or one blocklisted, unconsenting or
#                          uncovered member, must revert the whole cycle so it never settles half-way. A variant that
#                          skips or clamps bad clears was considered and rejected (docs/SECURITY.md, E-2). The
#                          constructor likewise rejects a bad token list as a whole.
exclude_lints = ["require-revert-in-loop"]

[fuzz]
runs = 2_000

[invariant]
runs = 256
depth = 120
fail_on_revert = false

[fmt]
line_length = 120
number_underscore = "thousands"

[rpc_endpoints]
arc = "https://rpc.mainnet.arc.io"
arc_testnet = "https://rpc.testnet.arc.io"
